    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #F8F0E0;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    #root { min-height: 100%; }

    /* Prevent double-tap zoom on buttons */
    button, input, select, textarea { touch-action: manipulation; }

    /* Safe area for iPhone notch / home bar */
    .safe-wrap {
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #FBF2E0; }
    ::-webkit-scrollbar-thumb { background: #C4A47A88; border-radius: 3px; }

    /* Animations */
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }

    /* iOS time picker tint */
    input[type=time]::-webkit-calendar-picker-indicator {
      filter: sepia(1) saturate(2) hue-rotate(10deg) brightness(0.7);
    }
    select option { background: #FFF8EE; color: #3D1C08; }
    button:active { transform: scale(0.96); }

      h1 { font-size: 26px !important; }
      .tab-btn { padding: 8px 12px !important; font-size: 12px !important; }

    function getDailyQuote() {
      const day = new Date();
      const idx = (day.getFullYear() * 366 + day.getMonth() * 31 + day.getDate()) % DAILY_QUOTES.length;

    }

    const DEFAULT_BLOCKS = [
      { id: 1000, task: "Setup + Triage",                start: "08:31", end: "08:45", category: "admin",    color: "purple" },
      { id: 1001, task: "Comment Resolution Block #1",   start: "08:45", end: "10:45", category: "comments", color: "cyan"   },
      { id: 1002, task: "Quick Reset",                   start: "10:45", end: "11:00", category: "break",    color: "orange" },
      { id: 1003, task: "Senior Agent Tasks (Block 1)",  start: "11:00", end: "12:00", category: "admin",    color: "purple" },
      { id: 1004, task: "Lunch Break",                   start: "12:00", end: "12:30", category: "break",    color: "orange" },
      { id: 1005, task: "Comment Resolution Block #2",   start: "12:30", end: "14:00", category: "comments", color: "cyan"   },
      { id: 1006, task: "Responses Block",               start: "14:00", end: "14:45", category: "other",    color: "pink"   },
      { id: 1007, task: "Senior Agent Tasks (Block 2)",  start: "14:45", end: "15:45", category: "admin",    color: "purple" },
      { id: 1008, task: "Buffer / Overflow",             start: "15:45", end: "16:15", category: "admin",    color: "yellow" },

    const CATEGORY_LABELS = {

      admin: "Admin", break: "Break", other: "Other",
    };

    function timeToMins(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
    function minsToTime(m) {
      return `${Math.floor(m/60).toString().padStart(2,"0")}:${(m%60).toString().padStart(2,"0")}`;
    }
    function duration(s, e) {
      let diff = timeToMins(e) - timeToMins(s);
      if (diff < 0) diff += 1440; // handle overnight
      return diff;
    }
    function fmt12(t) {
      const [h, m] = t.split(":").map(Number);
      const p = h >= 12 ? "PM" : "AM", hr = h % 12 === 0 ? 12 : h % 12;
      return `${hr}:${m.toString().padStart(2,"0")} ${p}`;
    }
    function fmtDur(mins) {
      if (!mins || mins <= 0) return '0m';
      const h = Math.floor(mins / 60), m = mins % 60;
      if (h === 0) return `${m}m`;
      if (m === 0) return `${h}h`;
      return `${h}h ${m}m`;
    }
    function parseFlexTime(str) {
      str = str.trim().toLowerCase().replace(/\s+/g,"");
      const ampm = str.includes("am") ? "am" : str.includes("pm") ? "pm" : null;
      const clean = str.replace("am","").replace("pm","");
      let h, m = 0;
      if (clean.includes(":")) [h, m] = clean.split(":").map(Number);
      else h = parseInt(clean);
      if (isNaN(h)) return null;
      if (ampm === "pm" && h !== 12) h += 12;
      if (ampm === "am" && h === 12) h = 0;
      if (h < 0 || h > 23) return null;
      return `${h.toString().padStart(2,"0")}:${(m||0).toString().padStart(2,"0")}`;
    }
    function parseDaySchedule(text) {
      const parts = text.split(/[-–]|to/i).map(s => s.trim());
      if (parts.length < 2) return null;
      const start = parseFlexTime(parts[0]), end = parseFlexTime(parts[1]);
      if (!start || !end) return null;
      return { start, end };
    }
    function rescaleBlocks(blocks, ns, ne) {
      // Sort blocks by start time first
      const sorted = [...blocks].sort((a, b) => timeToMins(a.start) - timeToMins(b.start));

      let nS = timeToMins(ns), nE = timeToMins(ne);
      if (nE <= nS) nE += 1440; // handle overnight
      const nD = nE - nS;
      if (nD <= 0 || sorted.length === 0) return blocks;

      // Get original span
      let oS = timeToMins(sorted[0].start);
      let oE = timeToMins(sorted[sorted.length - 1].end);
      if (oE <= oS) oE += 1440; // handle overnight original
      const oD = oE - oS;

      // If all blocks are the same time, distribute evenly
      if (oD === 0) {
        const each = Math.floor(nD / sorted.length);
        return sorted.map((b, i) => ({
          ...b,
          start: minsToTime((nS + i * each) % 1440),
          end:   minsToTime((nS + (i + 1) * each) % 1440)
        }));
      }

      // Scale each block proportionally into the new window
      // Then do a final pack pass to fix any rounding gaps/overlaps
      const scaled = sorted.map(b => {
        let bS = timeToMins(b.start);
        let bE = timeToMins(b.end);
        if (bS < oS) bS += 1440;
        if (bE < bS) bE += 1440;
        const newS = Math.round((nS + ((bS - oS) / oD) * nD) / 5) * 5;
        const newE = Math.round((nS + ((bE - oS) / oD) * nD) / 5) * 5;
        // Ensure minimum 5 min duration
        const clampedS = Math.max(nS, Math.min(nE - 5, newS));
        const clampedE = Math.max(clampedS + 5, Math.min(nE, newE));
        return { ...b, _s: clampedS, _e: clampedE };
      });

      // Pack pass: if any block is shorter than 5 mins or overlaps next, fix it
      // Work forward, snapping each block to end of previous
      for (let i = 1; i < scaled.length; i++) {
        if (scaled[i]._s < scaled[i-1]._e) {
          const dur = scaled[i]._e - scaled[i]._s;
          scaled[i]._s = scaled[i-1]._e;
          scaled[i]._e = scaled[i]._s + Math.max(5, dur);
        }
      }

      // If last block overflows nE, compress from the back
      for (let i = scaled.length - 1; i >= 0; i--) {
        if (scaled[i]._e > nE) {
          scaled[i]._e = nE;
          scaled[i]._s = Math.min(scaled[i]._s, nE - 5);
        }
        if (i > 0 && scaled[i]._s < scaled[i-1]._e) {
          scaled[i-1]._e = scaled[i]._s;
        }
      }

      return scaled.map(b => {
        const result = { ...b, start: minsToTime(b._s % 1440), end: minsToTime(b._e % 1440) };
        delete result._s; delete result._e;
        return result;
      });
    }

    function App() {
      const [blocks,      setBlocks]      = useState(DEFAULT_BLOCKS);
      const [metrics,     setMetrics]     = useState({ resolved:247, responses:28, resolvedGoal:500, responseGoal:50 });
      const [editingId,   setEditingId]   = useState(null);
      const [editForm,    setEditForm]    = useState({});
      const [showAdd,     setShowAdd]     = useState(false);
      const [addMode,     setAddMode]     = useState("choice"); // "choice" | "comment" | "custom"
      const [newTask,     setNewTask]     = useState({ task:"", start:"", end:"", category:"other", color:"green" });
      const [cmStart,     setCmStart]     = useState("");
      const [cmEnd,       setCmEnd]       = useState("");

      const addCommentBlock = () => {
        if (!cmStart || !cmEnd) return;
        const nb = { task:"Comment Moderation", start:cmStart, end:cmEnd, category:"comments", color:"cyan", id:Date.now() };
        setBlocks([...blocks, nb].sort((a,b)=>timeToMins(a.start)-timeToMins(b.start)));
        setCmStart(""); setCmEnd("");
        setShowAdd(false); setAddMode("choice");
      };
      const [activeTab,   setActiveTab]   = useState("schedule");
      const [aiLoading,   setAiLoading]   = useState(false);
      const [aiSugg,      setAiSugg]      = useState(null);
      const [aiInput,     setAiInput]     = useState("");
      const [aiMode,      setAiMode]      = useState("single");
      const [buildInput,  setBuildInput]  = useState("");
      const [buildPlan,   setBuildPlan]   = useState(null);
      const [buildLoading,setBuildLoading]= useState(false);

      const [schedErr,    setSchedErr]    = useState(null);
      const [shiftStart,  setShiftStart]  = useState("08:30");
      const [shiftEnd,    setShiftEnd]    = useState("16:30");
      // dayStart/dayEnd always mirror shiftStart/shiftEnd — kept for compatibility
      const [dayStart,    setDayStart]    = useState("08:30");
      const [dayEnd,      setDayEnd]      = useState("16:30");

      // ── Hootsuite sync state ──
      const lsGet = k => { try { return localStorage.getItem(k)||''; } catch(e){ return ''; } };
      const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };


      // ── Live clock ──
      const TIMEZONES = [
        { label:"🌅 Eastern (ET)",        tz:"America/New_York"      },
        { label:"🌾 Central (CT)",         tz:"America/Chicago"       },
        { label:"🏔 Mountain (MT)",        tz:"America/Denver"        },
        { label:"🌊 Pacific (PT)",         tz:"America/Los_Angeles"   },
        { label:"🐻 Alaska (AKT)",         tz:"America/Anchorage"     },
        { label:"🌺 Hawaii (HST)",         tz:"Pacific/Honolulu"      },
        { label:"🗽 Atlantic (AT)",        tz:"America/Halifax"       },
        { label:"🗼 London (GMT/BST)",     tz:"Europe/London"         },
        { label:"🥐 Paris (CET)",          tz:"Europe/Paris"          },
        { label:"🌏 Tokyo (JST)",          tz:"Asia/Tokyo"            },
        { label:"🦘 Sydney (AEDT)",        tz:"Australia/Sydney"      },
      ];
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const [clockTz,  setClockTzRaw] = useState(() => lsGet('clock_tz') || localTz);
      const [liveTime, setLiveTime]   = useState(new Date());
      const saveClockTz = v => { setClockTzRaw(v); lsSet('clock_tz', v); };
      const [notifPerm,   setNotifPerm]   = useState(() => {
        try { return Notification.permission; } catch(e) { return 'unsupported'; }
      });
      const [lastNotifId, setLastNotifId] = useState(null); // track which block we last notified

      useEffect(() => {
        const id = setInterval(() => setLiveTime(new Date()), 1000);
        return () => clearInterval(id);
      }, []);

      // ── Notification trigger: fires when active block changes ──
      useEffect(() => {
        if (notifPerm !== 'granted') return;
        if (!activeBlock) return;
        if (activeBlock.id === lastNotifId) return;
        setLastNotifId(activeBlock.id);
        try {
          const minsLeft = minsLeftInBlock(activeBlock);
          const body = `${fmt12(activeBlock.start)} – ${fmt12(activeBlock.end)} · ${minsLeft}m remaining`;
          const n = new Notification(`🤠 Trail Stop: ${activeBlock.task}`, {
            body,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="28" font-size="28">🤠</text></svg>',
            badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="28" font-size="28">🤠</text></svg>',
            tag: 'task-ranch-block',
            requireInteraction: false,
          });
          setTimeout(() => n.close(), 8000);
        } catch(e) { /* notification failed silently */ }
      }, [activeBlock?.id, notifPerm]);

      // ── 5-min warning notification ──
      useEffect(() => {
        if (notifPerm !== 'granted') return;
        if (!activeBlock) return;
        const mLeft = minsLeftInBlock(activeBlock);
        if (mLeft !== 5) return;
        try {
          const n = new Notification(`⏰ 5 min left: ${activeBlock.task}`, {
            body: `Wrapping up at ${fmt12(activeBlock.end)}`,
            tag: 'task-ranch-warning',
            requireInteraction: false,
          });
          setTimeout(() => n.close(), 6000);
        } catch(e) {}
      }, [nowInTz, notifPerm]);

      const fmtClock = (date, tz) => date.toLocaleTimeString('en-US', {
        timeZone: tz, hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true
      });
      const fmtDate = (date, tz) => date.toLocaleDateString('en-US', {
        timeZone: tz, weekday:'long', month:'long', day:'numeric'
      });
      const tzLabel = TIMEZONES.find(t=>t.tz===clockTz)?.label || clockTz;

      const rGoal = metrics.resolvedGoal, rsGoal = metrics.responseGoal;
      const rPct  = Math.min(100, Math.round((metrics.resolved  / Math.max(1,rGoal))  * 100));
      const rsPct = Math.min(100, Math.round((metrics.responses / Math.max(1,rsGoal)) * 100));
      const rRate = metrics.resolved > 0 ? ((metrics.responses/metrics.resolved)*100).toFixed(1) : "0.0";

      // ── Current time awareness (uses live clock + selected timezone) ──
      const nowInTz = (() => {
        const parts = liveTime.toLocaleString('en-US', { timeZone: clockTz, hour:'2-digit', minute:'2-digit', hour12:false }).split(':');
        const h = parseInt(parts[0]), m = parseInt(parts[1]);
        return h * 60 + (isNaN(m) ? 0 : m);
      })();
      const getBlockStatus = (block) => {
        const bS = timeToMins(block.start), bE = timeToMins(block.end);
        if (nowInTz < bS) return 'upcoming';
        if (nowInTz >= bE) return 'done';
        return 'active';
      };
      const activeBlock = blocks.find(b => getBlockStatus(b) === 'active') || null;
      const blockProgress = (block) => {
        const bS = timeToMins(block.start), bE = timeToMins(block.end);
        const dur = bE - bS;
        if (dur <= 0) return 0;
        return Math.min(100, Math.max(0, Math.round(((nowInTz - bS) / dur) * 100)));
      };
      const minsLeftInBlock = (block) => Math.max(0, timeToMins(block.end) - nowInTz);

      const totalWork    = blocks.filter(b=>b.category!=="break").reduce((s,b)=>s+duration(b.start,b.end),0);
      // Shift total duration for reference
      const shiftTotal   = (() => { let s=timeToMins(dayStart), e=timeToMins(dayEnd); if(e<=s) e+=1440; return e-s; })();
      const commentMins  = blocks.filter(b=>b.category==="comments").reduce((s,b)=>s+duration(b.start,b.end),0);
      const remaining    = Math.max(0, rGoal - metrics.resolved);
      const cBlocks      = blocks.filter(b=>b.category==="comments");
      const totalCMins   = cBlocks.reduce((s,b)=>s+duration(b.start,b.end),0);
      const cQuotas = cBlocks.reduce((acc,b)=>{
        acc[b.id] = Math.round(metrics.resolvedGoal * (totalCMins>0 ? duration(b.start,b.end)/totalCMins : 0));
        return acc;
      },{});
      // Fill blocks sequentially (earliest first) — you work through them in order,
      // so Block #1 is credited as complete before Block #2 gets any "done" progress.
      const cDone = (() => {
        const result = {};
        let pool = metrics.resolved;
        const seq = [...cBlocks].sort((a,b) => timeToMins(a.start) - timeToMins(b.start));
        seq.forEach(b => {
          const q = cQuotas[b.id] || 0;
          const d = Math.min(q, pool);
          result[b.id] = d;
          pool = Math.max(0, pool - d);
        });
        return result;
      })();
      const cTargets = cBlocks.reduce((acc,b)=>{
        acc[b.id] = Math.max(0, (cQuotas[b.id]||0) - (cDone[b.id]||0));
        return acc;
      },{});
      const cPerMin = totalCMins > 0 ? (remaining/totalCMins).toFixed(2) : 0;
      const cCPH = cBlocks.reduce((acc,b)=>{
        const hrs = duration(b.start,b.end) / 60;
        acc[b.id] = hrs > 0 ? Math.round((cTargets[b.id]||0) / hrs) : 0;
        return acc;
      },{});
      const overallCPH = totalCMins > 0 ? Math.round(remaining / (totalCMins/60)) : 0;

      // ── Per-block RESPONSE breakdown ──
      const targetReplyRate = metrics.resolvedGoal > 0 ? metrics.responseGoal / metrics.resolvedGoal : 0.1;
      const cRespQuota = cBlocks.reduce((acc,b) => { acc[b.id] = Math.round((cQuotas[b.id]||0) * targetReplyRate); return acc;},{});
      const cRespDone  = (() => { const r={}; let pool=metrics.responses; const seq=[...cBlocks].sort((a,b)=>timeToMins(a.start)-timeToMins(b.start)); seq.forEach(b=>{ const q=cRespQuota[b.id]||0; const d=Math.min(q,pool); r[b.id]=d; pool=Math.max(0,pool-d); }); return r; })();
      const cRespLeft  = cBlocks.reduce((acc,b) => { acc[b.id] = Math.max(0, (cRespQuota[b.id]||0) - (cRespDone[b.id]||0)); return acc;},{});
      const cNoResp    = cBlocks.reduce((acc,b) => { acc[b.id] = Math.max(0, (cTargets[b.id]||0) - (cRespLeft[b.id]||0)); return acc;},{});

      const askAI = () => {
        if (!aiInput.trim()) return;

        setTimeout(() => {
          try {
            const input = aiInput.trim().toLowerCase();

            // ── 1. Estimate duration ──
            let estMins = 30;
            const mMatch = input.match(/(\d+)\s*min/);
            const hMatch = input.match(/(\d+(?:\.\d+)?)\s*hour/);
            if (mMatch) estMins = Math.min(240, Math.max(5, parseInt(mMatch[1])));
            else if (hMatch) estMins = Math.min(240, Math.round(parseFloat(hMatch[1]) * 60));
            else if (/\b(quick|brief|fast)\b/.test(input)) estMins = 10;
            else if (/\b15.?min\b/.test(input)) estMins = 15;
            else if (/\b(half.?hour|30.?min|1:1|one.on.one|standup|stand.?up|sync)\b/.test(input)) estMins = 30;
            else if (/\b(45.?min)\b/.test(input)) estMins = 45;
            else if (/\b(hour|training|workshop|deep.?work|focus)\b/.test(input)) estMins = 60;
            else if (/\b(90.?min|1.5.?hour)\b/.test(input)) estMins = 90;
            else if (/\b(2.?hour)\b/.test(input)) estMins = 120;

            // ── 2. Determine category & color ──
            let category = 'other', color = 'green';
            if (/\b(break|lunch|coffee|walk|rest|snack)\b/.test(input)) { category = 'break'; color = 'orange'; }
            else if (/\b(reply|response|respond|write|draft|email|message)\b/.test(input)) { category = 'other'; color = 'pink'; }
            else if (/\b(comment|mod|moderat|review|queue|batch)\b/.test(input)) { category = 'comments'; color = 'cyan'; }
            else if (/\b(meeting|standup|1:1|one.on.one|sync|call|training|workshop|check.?in|admin|plan|prioriti)\b/.test(input)) { category = 'admin'; color = 'purple'; }
            else if (/\b(test|qa|bot|tool|setup|config|report|analytic|data)\b/.test(input)) { category = 'other'; color = 'yellow'; }

            // ── 3. Find free gaps ──
            const sorted = [...blocks].sort((a,b) => timeToMins(a.start) - timeToMins(b.start));
            const getGaps = (blks) => {
              const dS = timeToMins(dayStart), dE = timeToMins(dayEnd);
              // Only consider blocks that fall within the work day
              const s = [...blks]
                .filter(b => timeToMins(b.end) > dS && timeToMins(b.start) < dE)
                .sort((a,b) => timeToMins(a.start) - timeToMins(b.start));
              const gaps = [];
              const effStart = s.length > 0 ? Math.max(dS, timeToMins(s[0].start)) : dS;
              if (effStart > dS)
                gaps.push({ start: dayStart, end: minsToTime(effStart), mins: effStart - dS, position: 'start', prevCat: null, nextCat: s[0]?.category, idx: -1 });
              for (let i = 0; i < s.length - 1; i++) {
                const gS = timeToMins(s[i].end), gE = Math.min(timeToMins(s[i+1].start), dE), gM = gE - gS;
                if (gM > 0 && gS < dE) gaps.push({ start: minsToTime(gS), end: minsToTime(gE), mins: gM, position: 'middle', prevCat: s[i].category, nextCat: s[i+1].category, idx: i });
              }
              const lastEnd = s.length > 0 ? timeToMins(s[s.length-1].end) : dS;
              if (lastEnd < dE)
                gaps.push({ start: minsToTime(lastEnd), end: dayEnd, mins: dE - lastEnd, position: 'end', prevCat: s[s.length-1]?.category, nextCat: null, idx: s.length-1 });
              if (s.length === 0)
                gaps.push({ start: dayStart, end: dayEnd, mins: dE - dS, position: 'start', prevCat: null, nextCat: null, idx: -1 });
              return gaps;
            };

            const scoreGap = (g) => {
              let score = 0;
              const waste = g.mins - estMins;
              score -= waste * 0.3;
              if (category === 'admin' || category === 'other') {
                if (g.prevCat === 'comments' && g.nextCat === 'comments') score += 50;
                else if (g.prevCat === 'comments' || g.nextCat === 'comments') score += 20;
              }
              if (category === 'break') {
                const mid = timeToMins(g.start) + g.mins / 2;
                score -= Math.abs(mid - 12*60) * 0.1;
              }
              if (category === 'comments' && (g.position === 'start' || g.position === 'end')) score += 15;
              if (g.prevCat !== 'comments' && g.nextCat !== 'comments') score += 10;
              score -= timeToMins(g.start) * 0.01;
              return score;
            };

            // ── 4. Try natural fit first — only gaps within dayStart–dayEnd ──
            const allGaps = getGaps(sorted);
            // Filter: gap must be within work hours AND task must end by dayEnd
            const naturalGaps = allGaps.filter(g => {
              const gStart = timeToMins(g.start);
              const gEnd   = timeToMins(g.end);
              const dStart = timeToMins(dayStart);
              const dEnd   = timeToMins(dayEnd);
              // Gap must start at or after dayStart, task must fit before dayEnd
              return gStart >= dStart && gStart + estMins <= dEnd && g.mins >= estMins;
            });
            if (naturalGaps.length > 0) {
              const best = naturalGaps.reduce((a,b) => scoreGap(a) >= scoreGap(b) ? a : b);
              const taskStart = best.start;
              // Clamp end to dayEnd
              const rawEnd = timeToMins(best.start) + estMins;
              const taskEnd = minsToTime(Math.min(rawEnd, timeToMins(dayEnd)));
              let reason = '';
              if (best.prevCat === 'comments' && best.nextCat === 'comments')
                reason = `Fits naturally in the ${best.mins}-min gap between two comment batches — zero disruption to your wrangling flow.`;
              else if (best.position === 'start')
                reason = `Placed at the start of your day before your first block — schedule untouched.`;
              else if (best.position === 'end')
                reason = `Placed at the end of your day — no blocks were moved.`;
              else
                reason = `Found a natural ${best.mins}-min gap — no blocks need to be adjusted.`;
              setAiSugg({ task: aiInput.trim(), start: taskStart, end: taskEnd, category, color, reason, adjustedBlocks: null });
              setAiLoading(false);
              return;
            }

            // ── 5. No natural gap — compress & shift blocks to fit within shift ──
            const dEndMins   = timeToMins(dayEnd);
            const dStartMins = timeToMins(dayStart);
            const shiftMins  = dEndMins - dStartMins;
            const MIN_BLOCK  = 5;

            // Hard clamp helper — force a value between shift boundaries
            const clamp = (v) => Math.max(dStartMins, Math.min(dEndMins, v));

            // Check there's physically enough shift time
            if (shiftMins < estMins + sorted.length * MIN_BLOCK) {
              setAiSugg({ error: `Your ${fmt12(dayStart)}–${fmt12(dayEnd)} shift (${shiftMins} min) is too short to fit a ${estMins}-minute task alongside ${sorted.length} existing blocks.` });
              setAiLoading(false);
              return;
            }

            // Core function: place task at insertAtMins, pack remaining blocks
            // into the remaining time, compress proportionally if needed.
            const tryInsert = (insertAtMins) => {
              // Hard clamp: task must start and end within shift
              const tS = clamp(insertAtMins);
              const tE = clamp(tS + estMins);
              if (tE - tS < estMins) return null; // task doesn't fully fit

              // Split blocks into "before task" and "after task"
              const before = sorted.filter(b => timeToMins(b.end) <= tS);
              const after  = sorted.filter(b => timeToMins(b.start) >= tE);
              const overlapping = sorted.filter(b =>
                timeToMins(b.start) < tE && timeToMins(b.end) > tS
              );
              // Treat overlapping blocks as "after" (they get pushed)
              const afterAll = [...overlapping, ...after].sort((a,b) => timeToMins(a.start)-timeToMins(b.start));

              // Time available after the task ends
              const afterAvail = dEndMins - tE;
              const afterNeed  = afterAll.reduce((s,b) => s + duration(b.start, b.end), 0);

              // If not enough room after task, fail this insertion point
              if (afterNeed > afterAvail && afterAll.length > 0) {
                // Try to compress — each block gets proportional share of afterAvail
                if (afterAvail < afterAll.length * MIN_BLOCK) return null;
              }

              // Pack "before" blocks — keep them as-is since they're before the task
              const wBefore = before.map(b => ({ ...b }));

              // Pack "after" blocks into [tE, dEndMins], compressing proportionally
              let wAfter = [];
              if (afterAll.length > 0) {
                const scale = afterAvail / Math.max(afterNeed, 1);
                let cursor = tE;
                wAfter = afterAll.map(b => {
                  const origDur = duration(b.start, b.end);
                  const newDur  = Math.max(MIN_BLOCK, Math.min(origDur, Math.floor(origDur * Math.min(scale, 1))));
                  const newStart = cursor;
                  const newEnd   = clamp(cursor + newDur);
                  cursor = newEnd;
                  return { ...b, start: minsToTime(newStart), end: minsToTime(newEnd) };
                });
              }

              // Final hard clamp pass — guarantee nothing escapes shift boundaries
              const allW = [
                ...wBefore.map(b => ({ ...b, start: minsToTime(clamp(timeToMins(b.start))), end: minsToTime(clamp(timeToMins(b.end))) })),
                ...wAfter.map(b => ({ ...b, start: minsToTime(clamp(timeToMins(b.start))), end: minsToTime(clamp(timeToMins(b.end))) })),
              ];

              // Verify no block is outside shift
              if (allW.some(b => timeToMins(b.start) < dStartMins || timeToMins(b.end) > dEndMins)) return null;
              // Verify no zero-duration blocks
              if (allW.some(b => timeToMins(b.end) - timeToMins(b.start) < MIN_BLOCK)) return null;

              // Compute what changed
              const changes = [];
              sorted.forEach(orig => {
                const updated = allW.find(b => b.id === orig.id);
                if (updated && (updated.start !== orig.start || updated.end !== orig.end)) {
                  changes.push({ name: orig.task, from: `${fmt12(orig.start)}–${fmt12(orig.end)}`, to: `${fmt12(updated.start)}–${fmt12(updated.end)}`, category: orig.category });
                }
              });

              const commentChanges = changes.filter(c => c.category === 'comments').length;
              const score = -commentChanges * 100 - changes.length * 10 - tS * 0.001;
              return { tS, tE, finalBlocks: allW, changes, score, commentChanges };
            };

            // Try all candidate insertion points — between/before/after existing blocks
            const candidates = [

              ...sorted.map(b => timeToMins(b.end)),
              ...sorted.map(b => timeToMins(b.start)),

                                  <div style={{ background:"#FFF3E0", border:`1.5px solid ${C("yellow")}`, borderRadius:8, padding:"6px 10px", marginBottom:8, display:"flex", alignItems:"baseline", gap:6, flexWrap:"wrap" }}>
                                    <span style={{ fontSize:9, color:"#9B7A5E", textTransform:"uppercase", letterSpacing:1 }}>Needed pace</span>
                                    <span style={{ fontSize:26, fontWeight:"bold", ...acc("yellow"), lineHeight:1 }}>{cCPH[block.id]}</span>
                                    <span style={{ fontSize:12, color:"#C4860A", fontWeight:"700" }}>comments/hr</span>
                                    <span style={{ fontSize:10, color:"#9B7A5E", marginLeft:4 }}>({left} left in {duration(block.start,block.end)}m)</span>
                                  </div>
                                )}
                                {/* ── Comment totals row ── */}
                                <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:5 }}>
                                  <div style={{ display:"flex", alignItems:"baseline", gap:3 }}>
                                    <span style={{ fontSize:9, color:"#9B7A5E", textTransform:"uppercase" }}>Goal</span>
                                    <span style={{ fontSize:22, fontWeight:"bold", ...acc("cyan") }}>{quota}</span>
                                  </div>
                                  <div style={{ display:"flex", alignItems:"baseline", gap:3 }}>
                                    <span style={{ fontSize:9, color:"#9B7A5E", textTransform:"uppercase" }}>Done</span>
                                    <span style={{ fontSize:16, fontWeight:"700", ...acc("green") }}>{done}</span>
                                  </div>
                                  <div style={{ display:"flex", alignItems:"baseline", gap:3 }}>
                                    <span style={{ fontSize:9, color:"#9B7A5E", textTransform:"uppercase" }}>Left</span>
                                    <span style={{ fontSize:16, fontWeight:"700", ...acc(left>0?"yellow":"green") }}>{left>0?left:"✓"}</span>
                                  </div>
                                </div>
                                {/* ── Progress bar ── */}
                                <div style={{ background:"#E8D8C0", borderRadius:4, height:6, overflow:"hidden", marginBottom:2 }}>
                                  <div style={{ height:"100%", width:`${pct}%`, background:pct>=100?`linear-gradient(90deg,${C("green")},${C("cyan")})`:`linear-gradient(90deg,${C("cyan")},${C("purple")})`, borderRadius:4, transition:"width 0.4s" }}/>
                                </div>
                                <div style={{ fontSize:9, color:"#9B7A5E", textAlign:"right", marginBottom:8 }}>{pct}% of batch goal</div>

                                {/* ── Response + No-response breakdown ── */}
                                {quota>0 && (
                                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginTop:2 }}>
                                    {/* Needs response */}
                                    <div style={{ background:"#FDF0F4", border:`1.5px solid ${C("pink")}44`, borderRadius:8, padding:"7px 10px" }}>
                                      <div style={{ fontSize:9, color:C("pink"), fontWeight:"700", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>💌 Needs Reply</div>
                                      <div style={{ display:"flex", alignItems:"baseline", gap:4, marginBottom:3 }}>
                                        <span style={{ fontSize:20, fontWeight:"bold", color:C("pink") }}>{respLeft>0?respLeft:"✓"}</span>
                                        <span style={{ fontSize:10, color:"#9B7A5E" }}>left</span>
                                        <span style={{ fontSize:10, color:"#B8956A", marginLeft:4 }}>/ {respQuota} goal</span>
                                      </div>
                                      <div style={{ background:"#E8D8C0", borderRadius:3, height:4, overflow:"hidden", marginBottom:3 }}>
                                        <div style={{ height:"100%", width:`${respPct}%`, background:`linear-gradient(90deg,${C("pink")},${C("yellow")})`, borderRadius:3, transition:"width 0.4s" }}/>
                                      </div>
                                      <div style={{ fontSize:8, color:C("pink"), fontWeight:"700" }}>{respDone} done · {respPct}%</div>
                                    </div>
                                    {/* Mod only */}
                                    <div style={{ background:"#F0F7F7", border:`1.5px solid ${C("cyan")}44`, borderRadius:8, padding:"7px 10px" }}>
                                      <div style={{ fontSize:9, color:C("cyan"), fontWeight:"700", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>🤠 Mod Only</div>
                                      <div style={{ display:"flex", alignItems:"baseline", gap:4, marginBottom:3 }}>
                                        <span style={{ fontSize:20, fontWeight:"bold", color:C("cyan") }}>{noResp>0?noResp:"✓"}</span>
                                        <span style={{ fontSize:10, color:"#9B7A5E" }}>left</span>
                                        <span style={{ fontSize:10, color:"#B8956A", marginLeft:4 }}>/ {Math.max(0,quota-respQuota)} goal</span>
                                      </div>
                                      <div style={{ background:"#E8D8C0", borderRadius:3, height:4, overflow:"hidden", marginBottom:3 }}>
                                        <div style={{ height:"100%", width:`${noResp===0?100:Math.round(((quota-respQuota-noResp)/Math.max(1,quota-respQuota))*100)}%`, background:`linear-gradient(90deg,${C("cyan")},${C("purple")})`, borderRadius:3, transition:"width 0.4s" }}/>
                                      </div>
                                      <div style={{ fontSize:8, color:C("cyan"), fontWeight:"700" }}>
                                        {Math.max(0,(quota-respQuota)-(noResp))} done · {noResp===0?100:Math.round(((quota-respQuota-noResp)/Math.max(1,quota-respQuota))*100)}%
                                      </div>
                                    </div>
                                  </div>
                                )}
                              </div>
                            );
                          })()}
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                {/* Add block */}
                {!showAdd ? (
                  <button style={{ ...btn("green"), width:"100%", padding:"12px", fontSize:14 }} onClick={()=>{ setShowAdd(true); setAddMode("choice"); }}>＋ Add Trail Stop</button>
                ):(
                  <div style={{ ...card("green"), background:"#F7F5EE", borderRadius:10, padding:"14px" }}>
                    <div style={{ fontSize:11, color:C("green"), marginBottom:12, fontWeight:"700", textTransform:"uppercase" }}>✦ New Trail Stop</div>

                    {/* ── Mode: Choice ── */}
                    {addMode === "choice" && (
                      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                        {/* Comment Mod quick-add */}
                        <button
                          style={{ ...btn("cyan"), padding:"14px", fontSize:14, textAlign:"left", display:"flex", alignItems:"center", gap:12, width:"100%" }}
                          onClick={()=>setAddMode("comment")}>
                          <span style={{ fontSize:22 }}>🤠</span>
                          <div>
                            <div style={{ fontWeight:"700", fontSize:13 }}>Comment Moderation Block</div>
                            <div style={{ fontSize:11, color:C("cyan"), opacity:0.8, fontWeight:"400" }}>Add a 1-hour comment mod block — just pick the time</div>
                          </div>
                        </button>
                        {/* Custom block */}
                        <button
                          style={{ ...btn("green"), padding:"14px", fontSize:14, textAlign:"left", display:"flex", alignItems:"center", gap:12, width:"100%" }}
                          onClick={()=>setAddMode("custom")}>
                          <span style={{ fontSize:22 }}>✏️</span>
                          <div>
                            <div style={{ fontWeight:"700", fontSize:13 }}>Custom Time Block</div>
                            <div style={{ fontSize:11, color:C("green"), opacity:0.8, fontWeight:"400" }}>Write your own task name, time, category & color</div>
                          </div>
                        </button>
                        <button style={btn("pink")} onClick={()=>setShowAdd(false)}>Cancel</button>
                      </div>
                    )}

                    {/* ── Mode: Comment Mod ── */}
                    {addMode === "comment" && (
                      <div>
                        <div style={{ fontSize:12, color:C("cyan"), fontWeight:"700", marginBottom:10 }}>🤠 Comment Moderation Block</div>
                        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12 }}>
                          <div>
                            <label style={{ fontSize:9, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1, display:"block", marginBottom:4 }}>Start Time</label>
                            <input style={inp()} type="time" value={cmStart} onChange={e=>setCmStart(e.target.value)}/>
                          </div>
                          <div>
                            <label style={{ fontSize:9, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1, display:"block", marginBottom:4 }}>End Time</label>
                            <input style={inp()} type="time" value={cmEnd} onChange={e=>setCmEnd(e.target.value)}/>
                          </div>
                        </div>
                        {cmStart && cmEnd && timeToMins(cmEnd) > timeToMins(cmStart) && (
                          <div style={{ fontSize:11, color:C("cyan"), marginBottom:10, fontWeight:"600" }}>
                            ⏱ {fmtDur(duration(cmStart, cmEnd))} comment mod block
                          </div>
                        )}
                        <div style={{ display:"flex", gap:8 }}>
                          <button style={btn("cyan")} onClick={addCommentBlock} disabled={!cmStart||!cmEnd}>✓ Add Block</button>
                          <button style={btn("yellow")} onClick={()=>setAddMode("choice")}>← Back</button>
                          <button style={btn("pink")} onClick={()=>{ setShowAdd(false); setAddMode("choice"); }}>Cancel</button>
                        </div>
                      </div>
                    )}

                    {/* ── Mode: Custom ── */}
                    {addMode === "custom" && (
                      <div>
                        <div style={{ fontSize:12, color:C("green"), fontWeight:"700", marginBottom:10 }}>✏️ Custom Time Block</div>
                        <div className="add-grid" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                          <input className="add-grid-name" style={{ ...inp(), gridColumn:"1/-1" }} placeholder="Task name" value={newTask.task} onChange={e=>setNewTask({...newTask,task:e.target.value})}/>
                          <input style={inp()} type="time" value={newTask.start} onChange={e=>setNewTask({...newTask,start:e.target.value})}/>
                          <input style={inp()} type="time" value={newTask.end}   onChange={e=>setNewTask({...newTask,end:e.target.value})}/>
                          <select style={inp()} value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}>
                            {Object.entries(CATEGORY_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                          </select>
                          <select style={inp()} value={newTask.color} onChange={e=>setNewTask({...newTask,color:e.target.value})}>
                            {Object.keys(COLORS).map(c=><option key={c} value={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
                          </select>
                        </div>
                        <div style={{ display:"flex", gap:8 }}>
                          <button style={btn("green")} onClick={()=>{ addBlock(); setAddMode("choice"); }}>✓ Add Block</button>
                          <button style={btn("yellow")} onClick={()=>setAddMode("choice")}>← Back</button>
                          <button style={btn("pink")} onClick={()=>{ setShowAdd(false); setAddMode("choice"); }}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ── METRICS TAB ── */}
            {activeTab === "metrics" && (
              <div>

                <div className="metrics-grid" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:18 }}>
                  {/* Resolved */}
                  <div style={{ ...card("cyan"), background:"#FFF8EE", borderRadius:10, padding:"16px" }}>
                    <div style={{ fontSize:10, letterSpacing:1, color:"#9B7A5E", marginBottom:8, fontWeight:"700", textTransform:"uppercase" }}>🤠 Comments Wrangled</div>
                    <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:10 }}>
                      <span style={{ fontSize:36, fontWeight:"bold", ...acc("cyan") }}>{metrics.resolved}</span>
                      <span style={{ color:"#9B7A5E", fontSize:14 }}>/ {rGoal}</span>
                    </div>
                    <div style={{ background:"#E8D8C0", borderRadius:6, height:10, marginBottom:5, overflow:"hidden" }}>
                      <div style={{ height:"100%", width:`${rPct}%`, background:`linear-gradient(90deg,${C("cyan")},${C("purple")})`, borderRadius:6, transition:"width 0.4s" }}/>
                    </div>
                    <div style={{ fontSize:11, color:C("cyan"), textAlign:"right", fontWeight:"700", marginBottom:12 }}>{rPct}% of quota</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      <div>
                        <label style={{ fontSize:10, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1 }}>Current Tally</label>
                        <div style={{ display:"flex", gap:6, marginTop:5, flexWrap:"wrap" }}>
                          <input style={{ ...inp(), flex:1, minWidth:60 }} type="number" min="0" value={metrics.resolved} onChange={e=>setMetrics({...metrics,resolved:Math.max(0,parseInt(e.target.value)||0)})}/>
                          <button style={btn("cyan",{padding:"8px 10px"})} onClick={()=>setMetrics({...metrics,resolved:Math.max(0,metrics.resolved-1)})}>−1</button>
                          <button style={btn("cyan",{padding:"8px 10px"})} onClick={()=>setMetrics({...metrics,resolved:metrics.resolved+1})}>+1</button>
                          <button style={btn("cyan",{padding:"8px 10px"})} onClick={()=>setMetrics({...metrics,resolved:metrics.resolved+10})}>+10</button>
                        </div>
                      </div>
                      <div>
                        <label style={{ fontSize:10, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1 }}>Daily Quota</label>
                        <div style={{ display:"flex", gap:6, marginTop:5 }}>
                          <input style={{ ...inp(), flex:1 }} type="number" min="1" value={metrics.resolvedGoal} onChange={e=>setMetrics({...metrics,resolvedGoal:Math.max(1,parseInt(e.target.value)||1)})}/>
                          <button style={btn("orange",{fontSize:11})} onClick={()=>setMetrics({...metrics,resolved:0})}>Reset</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Responses */}
                  <div style={{ ...card("pink"), background:"#FFF8EE", borderRadius:10, padding:"16px" }}>
                    <div style={{ fontSize:10, letterSpacing:1, color:"#9B7A5E", marginBottom:8, fontWeight:"700", textTransform:"uppercase" }}>💌 Replies Written</div>
                    <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:10 }}>
                      <span style={{ fontSize:36, fontWeight:"bold", ...acc("pink") }}>{metrics.responses}</span>
                      <span style={{ color:"#9B7A5E", fontSize:14 }}>/ {rsGoal}</span>
                    </div>
                    <div style={{ background:"#E8D8C0", borderRadius:6, height:10, marginBottom:5, overflow:"hidden" }}>
                      <div style={{ height:"100%", width:`${rsPct}%`, background:`linear-gradient(90deg,${C("pink")},${C("yellow")})`, borderRadius:6, transition:"width 0.4s" }}/>
                    </div>
                    <div style={{ fontSize:11, color:C("pink"), textAlign:"right", fontWeight:"700", marginBottom:12 }}>{rsPct}% of quota</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      <div>
                        <label style={{ fontSize:10, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1 }}>Current Tally</label>
                        <div style={{ display:"flex", gap:6, marginTop:5, flexWrap:"wrap" }}>
                          <input style={{ ...inp(), flex:1, minWidth:60 }} type="number" min="0" value={metrics.responses} onChange={e=>setMetrics({...metrics,responses:Math.max(0,parseInt(e.target.value)||0)})}/>
                          <button style={btn("pink",{padding:"8px 10px"})} onClick={()=>setMetrics({...metrics,responses:Math.max(0,metrics.responses-1)})}>−1</button>
                          <button style={btn("pink",{padding:"8px 10px"})} onClick={()=>setMetrics({...metrics,responses:metrics.responses+1})}>+1</button>
                          <button style={btn("pink",{padding:"8px 10px"})} onClick={()=>setMetrics({...metrics,responses:metrics.responses+5})}>+5</button>
                        </div>
                      </div>
                      <div>
                        <label style={{ fontSize:10, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1 }}>Daily Quota</label>
                        <div style={{ display:"flex", gap:6, marginTop:5 }}>
                          <input style={{ ...inp(), flex:1 }} type="number" min="1" value={metrics.responseGoal} onChange={e=>setMetrics({...metrics,responseGoal:Math.max(1,parseInt(e.target.value)||1)})}/>
                          <button style={btn("orange",{fontSize:11})} onClick={()=>setMetrics({...metrics,responses:0})}>Reset</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Rate */}
                <div style={{ ...card("yellow"), background:"#FFF8EE", borderRadius:10, padding:"16px", marginBottom:14 }}>
                  <div style={{ fontSize:10, letterSpacing:1, color:"#9B7A5E", marginBottom:10, fontWeight:"700", textTransform:"uppercase" }}>📊 Reply Rate Roundup</div>
                  <div className="rate-grid" style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:12 }}>
                    {[["Yer Rate",`${rRate}%`,parseFloat(rRate)>=10?"green":"pink"],
                      ["Target","10.0%","yellow"],
                      ["Needed",Math.max(0,Math.ceil(metrics.resolved*0.1)-metrics.responses),"cyan"],
                    ].map(([label,val,col])=>(
                      <div key={label} style={{ textAlign:"center" }}>
                        <div style={{ fontSize:9, color:"#9B7A5E", fontWeight:"700", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{label}</div>
                        <div style={{ fontSize:24, fontWeight:"bold", ...acc(col) }}>{val}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ background:"#E8D8C0", borderRadius:6, height:14, overflow:"hidden", position:"relative" }}>
                    <div style={{ height:"100%", width:`${Math.min(100,parseFloat(rRate)*10)}%`, background:parseFloat(rRate)>=10?`linear-gradient(90deg,${C("green")},${C("yellow")})`:`linear-gradient(90deg,${C("pink")},${C("yellow")})`, borderRadius:6, transition:"width 0.4s" }}/>
                    <div style={{ position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", fontSize:9, color:"#3D1C08", fontWeight:"bold", whiteSpace:"nowrap" }}>{rRate}% / 10% target</div>
                  </div>
                </div>

                {/* Batch Distribution */}
                {cBlocks.length > 0 && (
                  <div style={{ ...card("cyan"), background:"#FFF8EE", borderRadius:10, padding:"16px", marginBottom:14 }}>
                    <div style={{ fontSize:10, letterSpacing:1, color:C("cyan"), marginBottom:12, fontWeight:"700", textTransform:"uppercase" }}>🗂 Comment Batch Distribution</div>
                      {remaining > 0 && (
                      <div style={{ background:"#FFF3E0", border:`1.5px solid ${C("yellow")}`, borderRadius:8, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"baseline", gap:8, flexWrap:"wrap" }}>
                        <span style={{ fontSize:9, color:"#9B7A5E", textTransform:"uppercase", letterSpacing:1 }}>Overall pace needed</span>
                        <span style={{ fontSize:30, fontWeight:"bold", ...acc("yellow"), lineHeight:1 }}>{overallCPH}</span>
                        <span style={{ fontSize:13, color:"#C4860A", fontWeight:"700" }}>comments/hr</span>
                        <span style={{ fontSize:11, color:"#9B7A5E" }}>across {fmtDur(totalCMins)} of wrangling time</span>
                      </div>
                    )}
                    <div style={{ fontSize:11, color:"#9B7A5E", marginBottom:12 }}>
                      Your {metrics.resolvedGoal} comment goal, split across each wrangling block by time:
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      {cBlocks.map((b,i)=>{
                        const quota = cQuotas[b.id]||0;
                        const done  = cDone[b.id]||0;
                        const left  = cTargets[b.id]||0;
                        const pct   = Math.min(100, Math.round((done/Math.max(1,quota))*100));
                        return (
                          <div key={b.id} style={{ background:"#F7F0E3", border:"1px solid #C4A47A33", borderRadius:8, padding:"10px 12px" }}>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                              <div>
                                <span style={{ fontSize:11, fontWeight:"700", color:C("cyan") }}>Batch {i+1}</span>
                                <span style={{ fontSize:10, color:"#9B7A5E", marginLeft:8 }}>{fmt12(b.start)} – {fmt12(b.end)} · {duration(b.start,b.end)}m</span>
                              </div>
                              <div style={{ display:"flex", gap:10, alignItems:"baseline", flexWrap:"wrap" }}>
                                <span style={{ fontSize:10, color:"#9B7A5E" }}>Goal: <strong style={acc("cyan")}>{quota}</strong></span>
                                <span style={{ fontSize:10, color:"#9B7A5E" }}>Done: <strong style={acc("green")}>{done}</strong></span>
                                <span style={{ fontSize:10, color:"#9B7A5E" }}>Left: <strong style={acc(left>0?"yellow":"green")}>{left>0?left:"✓"}</strong></span>
                                {left>0 && <span style={{ fontSize:10, color:C("yellow"), fontWeight:"700" }}>⚡ {cCPH[b.id]}/hr</span>}
                              </div>
                            </div>
                            <div style={{ background:"#E8D8C0", borderRadius:4, height:8, overflow:"hidden" }}>
                              <div style={{ height:"100%", width:`${pct}%`, background:pct>=100?`linear-gradient(90deg,${C("green")},${C("cyan")})`:`linear-gradient(90deg,${C("cyan")},${C("purple")})`, borderRadius:4, transition:"width 0.4s" }}/>
                            </div>
                            <div style={{ fontSize:9, color:"#9B7A5E", textAlign:"right", marginTop:3 }}>{pct}%</div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ marginTop:10, paddingTop:10, borderTop:"1px dashed #C4A47A55", display:"flex", justifyContent:"space-between", fontSize:11, flexWrap:"wrap", gap:4 }}>
                      <span style={{ color:"#9B7A5E" }}>Total goal: <strong style={acc("cyan")}>{metrics.resolvedGoal}</strong></span>
                      <span style={{ color:"#9B7A5E" }}>Done: <strong style={acc("green")}>{metrics.resolved}</strong></span>
                      <span style={{ color:"#9B7A5E" }}>Remaining: <strong style={acc(remaining>0?"yellow":"green")}>{remaining>0?remaining:"✓ All done!"}</strong></span>
                    </div>
                  </div>
                )}

                {/* Status */}
                <div style={{ ...card(rPct>=100&&rsPct>=100?"green":"purple"), background:"#FFF8EE", borderRadius:10, padding:"14px 16px", textAlign:"center" }}>
                  <div style={{ fontSize:14, fontWeight:"700", ...acc(rPct>=100&&rsPct>=100?"green":"purple") }}>
                    {rPct>=100&&rsPct>=100?"🎉 Yeehaw — All Goals Met, Cowpoke!":rPct>=50?"🐴 On the Trail — Keep Ridin'!":"⚡ Fallin' Behind — Giddy Up!"}
                  </div>
                  <div style={{ fontSize:11, color:"#9B7A5E", marginTop:5 }}>
                    {rGoal-metrics.resolved>0?`${rGoal-metrics.resolved} comments left to hit yer daily quota`:"Comments quota complete, partner!"}
                  </div>
                </div>
              </div>
            )}

            {/* ── AI TAB ── */}
            {activeTab === "ai" && (
              <div>

                {/* Mode switcher */}
                <div style={{ display:"flex", gap:6, marginBottom:14 }}>
                  {[["single","🌟","Find a Slot"],["build","🏗","Build My Day"]].map(([mode,icon,label])=>(
                    <button key={mode} onClick={()=>{ setAiMode(mode); setAiSugg(null); setBuildPlan(null); }} style={{
                      flex:1, padding:"10px 8px", borderRadius:8, fontSize:12, fontWeight:"700",
                      fontFamily:"Georgia,serif", cursor:"pointer", letterSpacing:0.5,
                      background: aiMode===mode ? C("purple")+"22" : "transparent",
                      border: aiMode===mode ? `2px solid ${C("purple")}` : "2px solid #C4A47A55",
                      color: aiMode===mode ? C("purple") : "#9B7A5E",
                      WebkitTapHighlightColor:"transparent",
                    }}>{icon} {label}</button>
                  ))}
                </div>

                {/* ── Single task mode ── */}
                {aiMode === "single" && (
                  <div>
                    <div style={{ ...card("purple"), background:"#FFF8EE", borderRadius:10, padding:"18px", marginBottom:14 }}>
                      <div style={{ fontSize:11, letterSpacing:1, color:C("purple"), marginBottom:8, fontWeight:"700", textTransform:"uppercase" }}>🌟 Trail Boss Planner</div>
                      <div style={{ fontSize:13, color:"#6B4E35", marginBottom:14, lineHeight:1.7 }}>Describe a new task and the Trail Boss will analyze your free gaps, protect your comment batches, and place it in the <strong>most efficient slot</strong> — without disrupting your wrangling flow.</div>
                      <textarea style={{ ...inp(), minHeight:80, resize:"vertical", marginBottom:10 }}
                        placeholder="e.g. '30 min 1:1 with my manager'"
                        value={aiInput} onChange={e=>setAiInput(e.target.value)}
                      />
                      <button style={{ ...btn("purple"), width:"100%", padding:"12px", fontSize:13, opacity:aiLoading?0.5:1 }} onClick={askAI} disabled={aiLoading}>
                        {aiLoading?"🔍 Scoutin' the trail...":"🌟 Find the Best Slot"}
                      </button>
                    </div>

                    {aiLoading&&(
                      <div style={{ ...card("purple"), background:"#FFF8EE", borderRadius:10, padding:"20px", textAlign:"center" }}>
                        <div style={{ fontSize:13, fontWeight:"700", ...acc("purple") }}>Scoutin' the trail...</div>
                        <div style={{ marginTop:10, display:"flex", justifyContent:"center", gap:8 }}>
                          {[0,1,2,3,4].map(i=><div key={i} style={{ width:9, height:9, background:C("purple"), borderRadius:"50%", animation:`bounce ${0.6+i*0.1}s infinite alternate` }}/>)}
                        </div>
                      </div>
                    )}

                    {aiSugg&&!aiSugg.error&&(
                      <div style={{ ...card(aiSugg.adjustedBlocks?"yellow":"green"), background:"#FFF8EE", borderRadius:10, padding:"16px" }}>
                        <div style={{ fontSize:10, letterSpacing:1, color:C(aiSugg.adjustedBlocks?"yellow":"green"), marginBottom:10, fontWeight:"700", textTransform:"uppercase" }}>
                          {aiSugg.adjustedBlocks ? "⚙ Schedule Adjusted to Fit" : "✦ Recommended Trail Stop"}
                        </div>
                        <div style={{ fontSize:15, color:"#3D1C08", marginBottom:4, fontWeight:"600" }}>{aiSugg.task}</div>
                        <div style={{ fontSize:13, fontWeight:"700", ...acc("green"), marginBottom:8 }}>{fmt12(aiSugg.start)} – {fmt12(aiSugg.end)}</div>
                        <div style={{ fontSize:12, color:"#6B4E35", borderTop:"1px dashed #C4A47A", paddingTop:10, marginBottom:aiSugg.changes?.length>0?8:12, lineHeight:1.6 }}>{aiSugg.reason}</div>
                        {aiSugg.changes?.length > 0 && (
                          <div style={{ marginBottom:12, background:"#FFF8E0", border:`1.5px solid ${C("yellow")}44`, borderRadius:8, padding:"10px 12px" }}>
                            <div style={{ fontSize:10, color:C("yellow"), fontWeight:"700", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>📋 Blocks Being Adjusted</div>
                            {aiSugg.changes.map((c,i) => (
                              <div key={i} style={{ display:"flex", flexWrap:"wrap", gap:4, alignItems:"center", marginBottom:i<aiSugg.changes.length-1?6:0, fontSize:11 }}>
                                <span style={{ color:"#3D1C08", fontWeight:"600", flex:"1 1 120px" }}>{c.name}</span>
                                <span style={{ color:"#B85673", textDecoration:"line-through", whiteSpace:"nowrap" }}>{c.from}</span>
                                <span style={{ color:"#9B7A5E" }}>→</span>
                                <span style={{ color:"#5E8B5A", fontWeight:"700", whiteSpace:"nowrap" }}>{c.to}</span>
                              </div>
                            ))}
                          </div>
                        )}
                        <div style={{ display:"flex", gap:8 }}>
                          <button style={{ ...btn("green"), flex:1, padding:"10px" }} onClick={acceptSugg}>
                            🤠 {aiSugg.adjustedBlocks ? "Apply Changes & Add Task" : "Ride It — Add to Schedule"}
                          </button>
                          <button style={btn("pink")} onClick={()=>setAiSugg(null)}>Nope</button>
                        </div>
                      </div>
                    )}
                    {aiSugg?.error&&(
                      <div style={{ ...card("pink"), background:"#FFF8EE", borderRadius:10, padding:"12px", color:C("pink"), fontSize:12, fontWeight:"600" }}>⚠ {aiSugg.error}</div>
                    )}
                  </div>
                )}

                {/* ── Build My Day mode ── */}
                {aiMode === "build" && (
                  <div>
                    <div style={{ ...card("purple"), background:"#FFF8EE", borderRadius:10, padding:"18px", marginBottom:14 }}>
                      <div style={{ fontSize:11, letterSpacing:1, color:C("purple"), marginBottom:8, fontWeight:"700", textTransform:"uppercase" }}>🏗 Build My Day</div>
                      <div style={{ fontSize:13, color:"#6B4E35", marginBottom:14, lineHeight:1.7 }}>
                        Write your tasks for the day — one per line. Add a duration hint like <strong>30min</strong> or <strong>1hr</strong> and the Trail Boss will pack them into your shift in order.
                      </div>
                      <div style={{ fontSize:11, color:"#9B7A5E", marginBottom:10, background:"#F0EAD8", borderRadius:8, padding:"8px 12px", lineHeight:1.8 }}>
                        <strong style={{ color:C("yellow") }}>Examples:</strong><br/>
                        Morning standup 15min<br/>
                        Comment moderation 2hr<br/>
                        Lunch break 30min<br/>
                        Filmmaker leads 30min<br/>
                        EOD wrap-up 15min
                      </div>
                      <textarea style={{ ...inp(), minHeight:160, resize:"vertical", marginBottom:10 }}
                        placeholder={"Task one 30min\nTask two 1hr\nLunch break 30min\n..."}
                        value={buildInput} onChange={e=>setBuildInput(e.target.value)}
                      />
                      <div style={{ fontSize:11, color:"#9B7A5E", marginBottom:10 }}>
                        Shift: <strong style={{ color:C("orange") }}>{SHIFT_LABELS[shiftStart] || fmt12(dayStart)}</strong> – <strong style={{ color:C("orange") }}>{SHIFT_LABELS[shiftEnd] || fmt12(dayEnd)}</strong>
                        <span style={{ marginLeft:8 }}>({fmtDur(shiftTotal)} available)</span>
                      </div>
                      <button style={{ ...btn("purple"), width:"100%", padding:"12px", fontSize:13, opacity:buildLoading?0.5:1 }} onClick={buildMyDay} disabled={buildLoading}>
                        {buildLoading?"🔍 Wranglin' yer schedule...":"🏗 Build My Schedule"}
                      </button>
                    </div>

                    {buildLoading&&(
                      <div style={{ ...card("purple"), background:"#FFF8EE", borderRadius:10, padding:"20px", textAlign:"center" }}>
                        <div style={{ fontSize:13, fontWeight:"700", ...acc("purple") }}>Wranglin' yer tasks into order...</div>
                        <div style={{ marginTop:10, display:"flex", justifyContent:"center", gap:8 }}>
                          {[0,1,2,3,4].map(i=><div key={i} style={{ width:9, height:9, background:C("purple"), borderRadius:"50%", animation:`bounce ${0.6+i*0.1}s infinite alternate` }}/>)}
                        </div>
                      </div>
                    )}

                    {buildPlan&&!buildPlan.error&&(
                      <div style={{ ...card("green"), background:"#FFF8EE", borderRadius:10, padding:"16px", marginBottom:14 }}>
                        <div style={{ fontSize:10, letterSpacing:1, color:C("green"), marginBottom:4, fontWeight:"700", textTransform:"uppercase" }}>✦ Yer Day, All Wrangled Up</div>
                        <div style={{ fontSize:11, color:"#9B7A5E", marginBottom:12 }}>
                          {buildPlan.blocks.length} blocks · {fmtDur(buildPlan.totalMins)} scheduled · {fmtDur(buildPlan.shiftMins - buildPlan.totalMins)} free
                        </div>
                        <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:14 }}>
                          {buildPlan.blocks.map((b,i)=>{
                            const col = COLORS[b.color]||COLORS.green;
                            return (
                              <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 10px", borderRadius:8, border:`1.5px solid ${col}44`, background:"#FFFBF0", flexWrap:"wrap" }}>
                                <span style={{ fontSize:12, fontWeight:"700", color:col, minWidth:130, flexShrink:0 }}>{fmt12(b.start)} – {fmt12(b.end)}</span>
                                <span style={{ fontSize:13, color:"#3D1C08", flex:1 }}>{b.task}</span>
                                <span style={{ fontSize:10, padding:"2px 8px", border:`1.5px solid ${col}66`, borderRadius:12, color:col, fontWeight:"700", flexShrink:0 }}>{b.category}</span>
                                <span style={{ fontSize:11, color:"#9B7A5E", flexShrink:0 }}>{b.actualMins}m</span>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{ display:"flex", gap:8 }}>
                          <button style={{ ...btn("green"), flex:1, padding:"10px", fontSize:13 }} onClick={acceptBuildPlan}>
                            🤠 Load This Schedule — Let's Ride!
                          </button>
                          <button style={btn("pink")} onClick={()=>setBuildPlan(null)}>Nope</button>
                        </div>
                      </div>
                    )}

                    {buildPlan?.error&&(
                      <div style={{ ...card("pink"), background:"#FFF8EE", borderRadius:10, padding:"12px", color:C("pink"), fontSize:12, fontWeight:"600" }}>⚠ {buildPlan.error}</div>
                    )}
                  </div>
                )}

                {/* Trail map — always visible */}
                <div style={{ marginTop:16, ...card("cyan"), background:"#FFF8EE", borderRadius:10, padding:"14px 16px" }}>
                  <div style={{ fontSize:10, letterSpacing:1, color:C("cyan"), marginBottom:10, fontWeight:"700", textTransform:"uppercase" }}>🗺 Today's Trail Map</div>
                  {blocks.map(b=>(
                    <div key={b.id} style={{ display:"flex", gap:10, padding:"5px 0", borderBottom:"1px dashed #C4A47A33", fontSize:12, flexWrap:"wrap" }}>
                      <span style={{ color:C(b.color), minWidth:140, fontWeight:"700" }}>{fmt12(b.start)}–{fmt12(b.end)}</span>
                      <span style={{ color:"#3D1C08" }}>{b.task}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>{/* /safe-wrap */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
